[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automationstudio-sdk"
version = "0.1.0"
description = "Automation Studio Framework - AI-native automation engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Srikanth Samudrala" }
]
dependencies = [
    "pydantic>=2.0.0",
    "opencv-python>=4.8.0",
    "easyocr>=1.7.0",
    "numpy>=1.24.0",
    "mss>=7.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
